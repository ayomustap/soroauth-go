name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  # Provenance for the npm package is signed through GitHub's OIDC identity, so
  # the publish job needs to mint an id token. The same identity signs the
  # build provenance attestations and the keyless Sigstore bundles for the
  # binaries and the container image.
  id-token: write
  # Attestations are written to this repository's attestation store, which is
  # what `gh attestation verify` reads back.
  attestations: write

jobs:
  golden-drift:
    name: golden vectors are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: testdata/gen/package-lock.json
      - name: install the pinned reference sdk
        working-directory: testdata/gen
        run: npm ci
      - name: regenerate the vectors
        working-directory: testdata/gen
        run: node gen.mjs
      - name: fail if the committed vectors changed
        run: |
          if ! git diff --exit-code testdata/vectors; then
            echo
            echo "The committed golden vectors differ from freshly generated ones."
            echo "Vectors are never edited by hand. Regenerate them with:"
            echo "  cd testdata/gen && npm ci && node gen.mjs"
            echo "and commit the result, or investigate why the reference output moved."
            exit 1
          fi

  build:
    name: build binaries
    needs: golden-drift
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build
        id: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # The values --version reports. The tag is the version by definition
          # here: this workflow only runs on a `v*` tag push, so GITHUB_REF_NAME
          # is that tag and GITHUB_SHA is the commit it points at.
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          binary_name=soroauth
          if [ "${{ matrix.goos }}" = "windows" ]; then
            binary_name=soroauth.exe
          fi
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${build_date}" -o "${binary_name}" ./cmd/soroauth
          echo "binary=${binary_name}" >> "$GITHUB_OUTPUT"
      # The SBOM is scanned from the built binary, not from the source tree, so
      # it lists what this exact artifact contains. It is written next to the
      # binary and travels in the same artifact: a released binary, its SBOM
      # and its Sigstore bundle are one unit.
      - name: generate an SPDX-JSON SBOM for the binary
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: ${{ steps.build.outputs.binary }}
          format: spdx-json
          output-file: ${{ steps.build.outputs.binary }}.spdx.json
          # The release job publishes the SBOM (as a release asset, and inside
          # the attestation below); the action's own artifact upload would
          # duplicate it and its release-asset upload would race the release.
          upload-artifact: false
          upload-release-assets: false
      # Non-forgeable build provenance: the attestation is signed with a
      # certificate issued over this workflow's OIDC identity, and
      # `gh attestation verify` checks it against this repository. It states
      # which workflow, commit and runner produced these exact bytes. See
      # "Verifying a release" in README.md for what that does and does not
      # prove.
      - name: attest the binary's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.binary }}
      # The SBOM is attested as a second, separate statement about the same
      # subject, with the SPDX predicate type. GitHub's actions/attest-sbom is
      # deprecated (it prints a warning telling callers to use actions/attest),
      # so this uses actions/attest directly with its sbom-path input, which
      # creates the same SBOM attestation.
      - name: attest the SBOM for the binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.binary }}
          sbom-path: ${{ steps.build.outputs.binary }}.spdx.json
      # Keyless signing: the certificate behind this signature is issued
      # against the workflow's OIDC identity, so no long-lived key exists in CI
      # or in this repository. The bundle carries everything a verifier needs
      # (signature, certificate, chain, transparency-log entry) in one file.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: keyless-sign the binary
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "${{ steps.build.outputs.binary }}.sigstore.json" \
            "${{ steps.build.outputs.binary }}"
      - name: upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soroauth-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ steps.build.outputs.binary }}
            ${{ steps.build.outputs.binary }}.spdx.json
            ${{ steps.build.outputs.binary }}.sigstore.json
          retention-days: 1

  image:
    name: build and publish container image
    needs: golden-drift
    runs-on: ubuntu-latest
    outputs:
      # The digest of what was actually pushed, e.g. sha256:abc…. The release
      # job publishes it as an asset so verification can address the exact
      # image instead of a tag, which can be moved.
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: derive image tags
        id: tags
        run: |
          # ${GITHUB_REF_NAME} is the pushed tag, e.g. v0.1.0. The image gets
          # that exact tag plus `latest`, so a pull without a tag always gets
          # the newest release rather than needing the version pinned twice.
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/soroauth/soroauth-go:${{ steps.tags.outputs.version }}
            ghcr.io/soroauth/soroauth-go:latest
      # Everything below addresses the pushed digest, never a tag: a tag is
      # movable, the digest is not. When the image becomes multi-arch the only
      # thing that changes is what this digest names (a manifest list rather
      # than a single manifest) — the attestation and the signature still
      # attach to `steps.push.outputs.digest`, so the binaries and the image
      # stay covered by one scheme.
      - name: attest the image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/soroauth/soroauth-go
          subject-digest: ${{ steps.push.outputs.digest }}
          # Stored in the registry next to the image as well as in the
          # repository's attestation store, so a consumer who only has the
          # registry can run `gh attestation verify oci://…`.
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: keyless-sign the image digest
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/soroauth/soroauth-go@${{ steps.push.outputs.digest }}"

  # Regenerates the Homebrew formula and the Nix flake release version from the
  # just-built release binaries, so a human never has to remember to bump either
  # by hand. Runs on every v* tag, before the release is created, so the
  # formula's checksums always match the published binaries and the flake
  # reports the newest version on main.
  packaging:
    name: regenerate formula and flake
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      # Build the same release tarballs the release job ships, one per
      # platform, and their checksums. These checksums go into the formula.
      - name: build release tarballs and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            mkdir -p "dist/pack-${target}"
            cp "artifacts/soroauth-${target}/soroauth" "dist/pack-${target}/soroauth"
            tar -czf "dist/soroauth-${target}.tar.gz" -C "dist/pack-${target}" soroauth
            rm -rf "dist/pack-${target}"
          done
          if command -v sha256sum >/dev/null 2>&1; then
            ( cd dist && sha256sum soroauth-*.tar.gz | sort -k2 > ../checksums.txt )
          else
            ( cd dist && shasum -a 256 soroauth-*.tar.gz | sort -k2 > ../checksums.txt )
          fi
          cat checksums.txt
      # Render the formula against the real release binaries and the real
      # release download URLs, so the checksums and base URL match what a
      # `brew install` will fetch.
      - name: render the formula against the release binaries
        run: |
          set -euo pipefail
          scripts/gen-formula.sh \
            --version "${GITHUB_REF_NAME}" \
            --checksums checksums.txt \
            --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}" \
            --out soroauth.rb
      - name: upload the rendered formula
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soroauth-formula
          path: soroauth.rb
      # The flake reads its default version from this file when not fetched at
      # a tag, so a main install reports the newest release rather than a stale
      # value. Rewrite it from the tag.
      - name: update the flake release version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          printf '"%s"\n' "$version" > packaging/nix/release-version.nix
      # Commit the flake version bump to main. The formula itself is uploaded
      # as an artifact (the Homebrew tap lives in its own repository) and is
      # attached to the release by the release job below.
      - name: commit flake version to main
        run: |
          set -euo pipefail
          git checkout main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/nix/release-version.nix
          if ! git diff --cached --quiet; then
            git commit -m "packaging: bump release-version to ${GITHUB_REF_NAME}"
            git push origin main
          fi

  # Every parity suite must pass before the npm package is published. A package
  # whose bytes nobody cross-checked is exactly the artifact issue #54 says must
  # not ship, so this job re-runs the same checks CI runs rather than trusting
  # that they ran on the branch: a tag can point at any commit.
  wasm-parity:
    name: parity suites before publish
    needs: golden-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wasm/ts/package-lock.json
      - name: python sdk parity
        run: |
          python3 -m venv .venv-parity
          . .venv-parity/bin/activate
          pip install -r testdata/parity-python/requirements.txt
          python3 testdata/parity-python/parity.py
          python3 testdata/parity-python/test_parity.py
      - name: build the wasm module
        run: ./wasm/build.sh
      - name: wasm byte parity against the golden vectors
        run: node wasm/parity.mjs
      - name: typescript wrapper tests
        working-directory: wasm/ts
        run: |
          npm ci
          npm run typecheck
          npm test

  npm:
    name: publish @soroauth/wasm
    needs: wasm-parity
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and tags so the tagged commit can be identified.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: wasm/ts/package-lock.json
      # The version is derived from the tag, and the tag must be the commit
      # being published. Publishing from a branch, or from a commit the tag does
      # not point at, would ship bytes that do not match the release.
      - name: refuse to publish anything but the tagged commit
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "refusing to publish: GITHUB_REF_TYPE=${GITHUB_REF_TYPE}, expected 'tag'" >&2
            exit 1
          fi
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if [ "$head_sha" != "$tag_sha" ]; then
            echo "refusing to publish: HEAD ${head_sha} is not ${GITHUB_REF_NAME} (${tag_sha})" >&2
            exit 1
          fi
      - name: derive the package version from the tag
        working-directory: wasm/ts
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "publishing @soroauth/wasm@${version}"
      - name: build the wasm module from the tagged commit
        run: ./wasm/build.sh
      # prepack stages the wasm binary and its runtime shim into the tarball, so
      # the published package is self-contained and cannot reference a build
      # from another commit. --provenance attaches a signed statement tying the
      # tarball to this repository, commit and workflow run.
      - name: publish with provenance
        working-directory: wasm/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  docs-site:
    name: build and publish documentation site
    needs: golden-drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build and verify documentation site
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          go run ./scripts/docsite --out _site --version "${VERSION}"
      - name: publish site to gh-pages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git worktree add "$work" gh-pages
          else
            git worktree add --detach "$work"
            git -C "$work" checkout --orphan gh-pages
            git -C "$work" rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf "${work}/${VERSION}"
          mkdir -p "${work}/${VERSION}"
          cp -R _site/. "${work}/${VERSION}/"
          cp -R _site/. "${work}/"
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add -A
          if ! git -C "$work" diff --cached --quiet; then
            git -C "$work" commit -m "docs: publish site for ${VERSION}"
            git -C "$work" push origin gh-pages
          fi

  release:
    name: create release
    # Waits for the image too, so `needs.image.outputs.digest` exists: a release
    # is only created once every artifact it names — binaries, SBOMs, Sigstore
    # bundles and the image digest — has been produced, attested and signed.
    needs: [build, image, packaging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      # The man page is generated by the CLI itself, from the same command/flag
      # table the completion scripts come from, so the page attached to the
      # release cannot describe a flag this tag does not accept. Built for the
      # runner (linux/amd64) because the page is identical on every platform.
      - name: build the man page
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${build_date}" -o /tmp/soroauth-man ./cmd/soroauth
          /tmp/soroauth-man man --out soroauth.1
      - name: download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: download the rendered formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: soroauth-formula
          path: dist
      - name: prepare release notes
        id: notes
        run: |
          # Extract the section for this tag from CHANGELOG.md
          tag="${GITHUB_REF_NAME}"
          # Find the section for this version (e.g., ## [0.1.0] — 2026-09-16)
          # and everything until the next version header or EOF
          awk -v tag="$tag" '
            /^## \[/ { if (found && !printed) exit; if ($0 ~ "\\[" substr(tag, 2) "\\]") found=1 }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Could not find release notes for $tag in CHANGELOG.md" >&2
            exit 1
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: stage the release assets
        run: |
          set -euo pipefail
          # One distinct name per platform: each asset carries its own SBOM and
          # Sigstore bundle next to it, which only works if no two assets share
          # a basename. The binaries used to all be called `soroauth`, so at
          # most one of them could ever be attached; verification pairs
          # soroauth-<os>-<arch>[.exe] with its .spdx.json and .sigstore.json.
          mkdir -p dist
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            cp "artifacts/soroauth-${target}/soroauth" "dist/soroauth-${target}"
            cp "artifacts/soroauth-${target}/soroauth.spdx.json" "dist/soroauth-${target}.spdx.json"
            cp "artifacts/soroauth-${target}/soroauth.sigstore.json" "dist/soroauth-${target}.sigstore.json"
          done
          cp artifacts/soroauth-windows-amd64/soroauth.exe dist/soroauth-windows-amd64.exe
          cp artifacts/soroauth-windows-amd64/soroauth.exe.spdx.json dist/soroauth-windows-amd64.exe.spdx.json
          cp artifacts/soroauth-windows-amd64/soroauth.exe.sigstore.json dist/soroauth-windows-amd64.exe.sigstore.json
          cp soroauth.1 dist/
          # parity-report.json only exists when an e2e run produced one; it has
          # always been optional here and stays optional.
          if [ -f parity-report.json ]; then cp parity-report.json dist/; fi
          # The exact image the image job attested and signed, so a verifier
          # never has to trust a tag.
          printf '%s\n' "${{ needs.image.outputs.digest }}" > dist/soroauth-image-digest.txt
          ls -l dist
      - name: create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false

  # The release is not done until what a consumer downloads verifies. This job
  # downloads the release exactly the way the README's "Verifying a release"
  # section tells a consumer to, runs scripts/verify-release.sh over it, and
  # proves the gate bites: the script tampers with one verified binary and
  # requires BOTH verification paths (cosign and gh attestation verify) to
  # reject it. A failure here means the release is published but not provable.
  verify-release:
    name: verify the published release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Read back the attestations written by the build and image jobs.
      attestations: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # cosign verifies the image through ghcr.io. The image is public, but
      # logging in means verification behaves the same here as it does for a
      # consumer who has pulled the image.
      - name: log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: download the published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir release-assets
          ls -l release-assets
      - name: verify signatures, attestations and SBOMs, and reject a tampered binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/verify-release.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --dir release-assets \
            --tamper-demo

  # `go install` can fail for reasons the repo's own tests never see — a
  # module path typo, a tag the proxy refuses to index, a go.mod the
  # toolchain rejects — so the release is not done until the exact tag it
  # just published installs from the proxy and the installed CLI passes a
  # smoke test. This job runs after the release exists, against the proxy
  # rather than the checkout, so it proves what a user gets.
  install-check:
    name: install from proxy and smoke test
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          check-latest: true
      # The proxy indexes a new tag lazily: the tag push that started this
      # workflow does not mean proxy.golang.org serves it yet. Poll its
      # .info endpoint rather than failing the release on a race.
      - name: wait for the proxy to index the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "refusing: expected a version tag, got '${tag}'" >&2; exit 1;;
          esac
          for i in $(seq 1 30); do
            if curl -fsS "https://proxy.golang.org/github.com/soroauth/soroauth-go/@v/${tag}.info"; then
              echo "proxy serves ${tag}"
              exit 0
            fi
            echo "attempt ${i}/30: proxy does not serve ${tag} yet, waiting 20s"
            sleep 20
          done
          echo "proxy never indexed ${tag}" >&2
          exit 1
      # GOPROXY is pinned to the proxy (not the default chain, not direct)
      # so this step cannot accidentally pass by fetching from git. GOBIN
      # isolates the installed binary from the runner's GOPATH.
      - name: install the CLI from the proxy
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          bindir="${RUNNER_TEMP}/soroauth-bin"
          mkdir -p "$bindir"
          for i in $(seq 1 5); do
            if GOBIN="$bindir" go install "github.com/soroauth/soroauth-go/cmd/soroauth@${tag}"; then
              break
            fi
            echo "attempt ${i}/5: go install failed, waiting 30s"
            sleep 30
            if [ "$i" = "5" ]; then
              echo "go install of ${tag} failed after 5 attempts" >&2
              exit 1
            fi
          done
          test -x "${bindir}/soroauth"
          "${bindir}/soroauth" help
          echo "BIN=${bindir}/soroauth" >> "$GITHUB_ENV"
      # The CLI check above proves cmd/soroauth builds; this one proves the
      # library itself resolves as a dependency. A scratch module outside the
      # checkout runs `go get` at the tag against the proxy, then compiles
      # and runs a tiny program importing soroauth.
      - name: verify the module resolves from the proxy
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          go mod init installcheck >/dev/null
          go get "github.com/soroauth/soroauth-go@${tag}"
          go list -m github.com/soroauth/soroauth-go | grep -F "$tag"
          cat > main.go <<'EOF'
          package main

          import (
          	"fmt"
          	"os"

          	"github.com/soroauth/soroauth-go"
          )

          func main() {
          	v, err := soroauth.ExpirationAfter(100, 200)
          	if err != nil {
          		fmt.Fprintf(os.Stderr, "ExpirationAfter: %v\n", err)
          		os.Exit(1)
          	}
          	if v != 300 {
          		fmt.Fprintf(os.Stderr, "unexpected expiration: got %d, want 300\n", v)
          		os.Exit(1)
          	}
          	fmt.Println(v)
          }
          EOF
          test "$(go run .)" = "300"
          echo "module ${tag} resolves and links"
      # The installed binary — not the checkout — inspects a committed
      # golden vector and recomputes its payload, asserting both against the
      # vector's recorded values. An install that yields a binary which runs
      # but disagrees with the reference fails here rather than on a user's
      # machine.
      - name: CLI smoke test against a golden vector
        run: |
          set -euo pipefail
          entry="$(python3 -c "import json; print(json.load(open('testdata/vectors/v2_single_testnet.json'))['unsigned_entry_xdr'])")"
          expected_payload="$(python3 -c "import json; print(json.load(open('testdata/vectors/v2_single_testnet.json'))['payload_hex'])")"
          echo "inspect:"
          "$BIN" inspect --entry "$entry" --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['credential_type'] == 'address_v2', d; print('  credential_type:', d['credential_type']); print('  address:', d['address'])"
          echo "payload:"
          export EXPECTED_PAYLOAD="$expected_payload"
          "$BIN" payload --entry "$entry" --valid-until 1234567 --network testnet --json | python3 -c "import json,sys,os; d=json.load(sys.stdin); exp=os.environ['EXPECTED_PAYLOAD']; assert d['payload'] == exp, (d['payload'], exp); print('  payload matches vector:', d['payload'])"